name: Sync from wickra-embed

# The version this site shows is decided in wickra-lib/wickra-embed: the latest
# release, not the version on main -- between a bump merging and its tag being
# pushed, Cargo.toml is ahead of anything a reader can install. Pulling it on a
# schedule is the only trigger that can work: the value changes in the OTHER
# repository, so no push here is the event that makes this page wrong.
#
# Same shape as webpage's sync-from-wickra.yml.
on:
  schedule:
    - cron: "43 * * * *" # hourly at :43, clear of refresh-badges at :17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Pull the released version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commits the corrected values back to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the released version from wickra-embed
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/wickra-lib/wickra-embed/releases/latest -q '.tag_name')
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::latest release tag '${tag}' is not a plain vX.Y.Z; refusing to write it"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wickra-embed's latest release is ${version}"

      - name: Apply it
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s/(text: 'v)[0-9]+\.[0-9]+\.[0-9]+/\1${V}/" .vitepress/config.ts

      # The demo runs the indicator core, so its bundle follows wickra's release,
      # not this product's. npm rewrites package.json and the lockfile together;
      # a sed on package.json alone would leave `npm ci` refusing the mismatch.
      - name: Read the core's released version
        id: core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/wickra-lib/wickra/releases/latest -q '.tag_name')
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::wickra's latest release tag '${tag}' is not a plain vX.Y.Z; refusing to write it"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wickra's latest release is ${version}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Follow the core's release in the demo bundle
        env:
          C: ${{ steps.core.outputs.version }}
        # The point of the step is to move the lockfile; the version is the tag
        # wickra's release job just published, read from the API above.
        run: | # zizmor: ignore[adhoc-packages]
          set -euo pipefail
          if grep -q "\"wickra-wasm\": \"^${C}\"" package.json; then
            echo "already on wickra-wasm ^${C}"
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund "wickra-wasm@^${C}"

      - name: Commit if changed
        env:
          V: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "already at version ${V}; nothing to commit"
            exit 0
          fi
          git config user.name "wickra-bot"
          git config user.email "wickra-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync the released version to ${V}"
          # refresh-badges commits to this branch on its own hourly schedule;
          # rebase onto anything it landed in the meantime so the two never clash.
          git pull --rebase "https://github.com/${GITHUB_REPOSITORY}.git" main
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
