name: Sync from wickra-embed

# Every value this site states about wickra-embed is decided elsewhere and
# pulled from there:
#
# - The version -- wickra-embed's latest release, not the version on main:
#   between a bump merging and its tag being pushed, Cargo.toml is ahead
#   of anything a reader can install.
# - The indicator counts -- the core's, and the backtest registry's that the
#   registry products resolve through -- at the latest releases, set by the
#   org's one rule set, wickra-lib/.github's scripts/sync-counts.mjs, checked
#   out at a pinned commit (site_current.py moves the pin).
#
# A schedule is the only trigger that can work: the values change in the OTHER
# repositories, so no push here is the event that makes this page wrong.
#
# Same shape as webpage's sync-from-wickra.yml.
on:
  schedule:
    - cron: "43 * * * *" # hourly at :43, clear of refresh-badges at :17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Pull the released version and the indicator counts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commits the corrected values back to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the released version from wickra-embed
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/wickra-lib/wickra-embed/releases/latest -q '.tag_name')
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::latest release tag '${tag}' is not a plain vX.Y.Z; refusing to write it"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wickra-embed's latest release is ${version}"

      - name: Apply it
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s/(text: 'v)[0-9]+\.[0-9]+\.[0-9]+/\1${V}/" .vitepress/config.ts

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The demo runs the indicator core, so its bundle follows wickra's release,
      # not this product's. npm rewrites package.json and the lockfile together;
      # a sed on package.json alone would leave `npm ci` refusing the mismatch.
      - name: Read the core's released version
        id: core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/wickra-lib/wickra/releases/latest -q '.tag_name')
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::wickra's latest release tag '${tag}' is not a plain vX.Y.Z; refusing to write it"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wickra's latest release is ${version}"

      - name: Follow the core's release in the demo bundle
        env:
          C: ${{ steps.core.outputs.version }}
        # The point of the step is to move the lockfile; the version is the tag
        # wickra's release job just published, read from the API above.
        run: | # zizmor: ignore[adhoc-packages]
          set -euo pipefail
          if grep -q "\"wickra-wasm\": \"^${C}\"" package.json; then
            echo "already on wickra-wasm ^${C}"
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund "wickra-wasm@^${C}"

      # One file, read-only, at the commit site_current.py pinned. It lands
      # beside the site and is excluded from git, so the commit below cannot
      # pick it up.
      - name: Check out the count rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wickra-lib/.github
          ref: d683af6320d14973d311968842600b332b7d3e79
          path: .wickra-org
          sparse-checkout: scripts/sync-counts.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set the indicator counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo ".wickra-org/" >> .git/info/exclude
          node .wickra-org/scripts/sync-counts.mjs --repo wickra-embed-site

      - name: Commit if changed
        id: commitcheck
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "already at version ${V} with current counts; nothing to commit"
            echo "commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "commit=true" >> "$GITHUB_OUTPUT"

      - name: Commit (signed)
        if: steps.commitcheck.outputs.commit == 'true'
        uses: wickra-lib/.github/actions/signed-commit@da1bd395c27f33dbed632c8e4e48e12f85394858 # v1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: "chore: sync the released version to ${{ steps.version.outputs.version }} and the indicator counts"
          paths: .
